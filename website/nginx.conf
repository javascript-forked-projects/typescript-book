server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-rendered static pages (Astro generates directories with index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-cache immutable static assets
    location ~* \.(?:css|js|mjs|webp|png|jpg|jpeg|gif|svg|ico|woff2?|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
